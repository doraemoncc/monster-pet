<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宠物形象预览 - monster-pet</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #FFF8F0; color: #5D4037; padding: 16px; }
  h1 { text-align: center; font-size: 20px; margin-bottom: 16px; color: #FF9A56; }
  .controls { display: flex; gap: 12px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .controls label { font-size: 14px; display: flex; align-items: center; gap: 4px; }
  .controls select { padding: 4px 8px; border-radius: 8px; border: 1.5px solid #E0D5C8; background: white; }
  .controls button { padding: 4px 12px; border-radius: 8px; border: 1.5px solid #E0D5C8; background: white; cursor: pointer; font-size: 13px; color: #5D4037; }
  .controls button:hover { background: #FFF3E0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; max-width: 1200px; margin: 0 auto; }
  .card { background: white; border-radius: 16px; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center; transition: transform 0.2s; }
  .card:hover { transform: translateY(-2px); }
  .card canvas { display: block; margin: 0 auto; border-radius: 12px; background: #FAF3E8; }
  .card h3 { font-size: 14px; margin-top: 8px; color: #5D4037; }
  .acc-bar { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-bottom: 6px; }
  .acc-bar label { font-size: 11px; cursor: pointer; display: flex; align-items: center; gap: 2px; padding: 2px 4px; border-radius: 4px; background: #F5F0E8; }
  .acc-bar label.selected { background: #FFE0B2; border: 1px solid #FF9A56; }
  #loading-hint { text-align: center; font-size: 13px; color: #AAA; margin: 20px 0; }
</style>
</head>
<body>
<h1>🐉 宠物形象预览</h1>
<div id="loading-hint">正在加载图片素材（24张）...</div>
<div class="controls" id="ctrls" style="display:none">
  <label>阶段：<select id="stage-sel"><option value="0">蛋</option><option value="1">幼崽</option><option value="2">少年</option><option value="3" selected>成年</option></select></label>
  <label><input type="checkbox" checked id="anim-cb"> 播放动画</label>
  <button id="acc-btn">清除装扮</button>
</div>
<div class="grid" id="grid"></div>

<!-- 脚本放在 body 中，pet-renderer.js 先加载 -->
<script src="js/pet-renderer.js?v=20260614c"></script>
<script>
// 使用 var 避免与 pet-renderer.js 中的 const 声明冲突
var PREVIEW_PET_TYPES = {
  cat:     { name: '小猫咪',   emoji: '🐱' },
  fish:    { name: '小孔雀鱼', emoji: '🐟' },
  turtle:  { name: '小乌龟',   emoji: '🐢' },
  luna:    { name: '露娜小龙', emoji: '🐉' },
  fairy:   { name: '小精灵',   emoji: '🧚' },
  octopus: { name: '小章鱼',   emoji: '🐙' }
};

var ACCESSORIES = [
  { id: 'deco_crown', name: '👑 皇冠' },
  { id: 'deco_scarf', name: '🧣 围巾' },
  { id: 'deco_bow',   name: '🎀 蝴蝶结' },
  { id: 'deco_shell', name: '🐚 贝壳项链' },
  { id: 'deco_flower',name: '🌸 小花冠' },
  { id: 'deco_glasses',name:'🕶️ 墨镜' }
];

var PET_KEYS = Object.keys(PREVIEW_PET_TYPES);
var currentStage = 3;
var animate = true;
var selectedAccessory = '';  // 当前选中的装扮（单选，空=无）
var previewFrame = 0;
var animId = null;

function getActiveAccs() {
  return selectedAccessory ? [selectedAccessory] : [];
}

function renderGrid() {
  var grid = document.getElementById('grid');
  if (!grid) return;
  grid.innerHTML = '';

  for (var i = 0; i < PET_KEYS.length; i++) {
    var key = PET_KEYS[i];
    var card = document.createElement('div');
    card.className = 'card';

    // 装扮选择栏（单选）
    var accHtml = '<div class="acc-bar">';
    for (var j = 0; j < ACCESSORIES.length; j++) {
      var a = ACCESSORIES[j];
      var isSelected = selectedAccessory === a.id;
      accHtml += '<label class="' + (isSelected ? 'selected' : '') + '"><input type="radio" name="acc-select" value="' + a.id + '" ' + (isSelected ? 'checked' : '') + '> ' + a.name + '</label>';
    }
    accHtml += '</div>';

    card.innerHTML = accHtml + '<canvas width="300" height="300" data-type="' + key + '"></canvas><h3>' + PREVIEW_PET_TYPES[key].name + '</h3>';
    grid.appendChild(card);

    var canvas = card.querySelector('canvas');
    var ctx = canvas.getContext('2d');
    var pet = { type: key, stage: currentStage, mood: 80, hunger: 80, energy: 80, sick: false, accessories: getActiveAccs(), _anchorPoints: null };

    try {
      drawPet(ctx, pet, previewFrame);
    } catch(e) {
      ctx.font = '12px monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#E53935';
      ctx.fillText('渲染错误: ' + String(e.message).substring(0, 30), 150, 150);
      console.error('[preview] drawPet error for ' + key + ':', e);
    }
  }

  // 绑定单选事件
  document.querySelectorAll('input[name="acc-select"]').forEach(function(radio) {
    radio.addEventListener('change', function() {
      selectedAccessory = this.value;
      renderGrid();
    });
  });
}

function animateLoop() {
  if (!animate) return;
  previewFrame++;
  var cards = document.querySelectorAll('.card');
  for (var c = 0; c < cards.length; c++) {
    var card = cards[c];
    var canvas = card.querySelector('canvas');
    if (!canvas) continue;
    var ctx = canvas.getContext('2d');
    var key = canvas.dataset.type;
    var pet = { type: key, stage: currentStage, mood: 80, hunger: 80, energy: 80, sick: false, accessories: getActiveAccs(), _anchorPoints: null };
    try { drawPet(ctx, pet, previewFrame); } catch(e) {}
  }
  animId = requestAnimationFrame(animateLoop);
}

function stopAnimation() {
  if (animId) cancelAnimationFrame(animId);
  animId = null;
}

// 控件事件
document.getElementById('stage-sel').addEventListener('change', function() {
  currentStage = parseInt(this.value);
  renderGrid();
});
document.getElementById('anim-cb').addEventListener('change', function() {
  animate = this.checked;
  if (animate) animateLoop(); else stopAnimation();
});
document.getElementById('acc-btn').addEventListener('click', function() {
  selectedAccessory = '';
  renderGrid();
});

// 等待图片预加载完成后再渲染
function waitForImagesThenRender() {
  var checkCount = 0;
  var maxChecks = 75; // 15秒

  function check() {
    checkCount++;
    if ((typeof _petImagesReady !== 'undefined' && _petImagesReady) || checkCount >= maxChecks) {
      // 图片就绪（或超时）→ 渲染
      document.getElementById('loading-hint').style.display = 'none';
      document.getElementById('ctrls').style.display = '';
      renderGrid();
      animateLoop();
    } else {
      setTimeout(check, 200);
    }
  }
  check();
}

waitForImagesThenRender();
</script>
</body>
</html>
