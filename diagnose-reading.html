<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阅读书目诊断与清理</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #FFF8F0; color: #5D4037; margin: 0; padding: 20px; line-height: 1.6; }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .sub { font-size: 13px; color: #8D6E63; margin-bottom: 18px; }
  .card { background: #fff; border-radius: 14px; padding: 16px 18px; margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  .card h2 { font-size: 15px; margin: 0 0 10px; }
  .row { font-size: 14px; padding: 6px 0; border-bottom: 1px dashed #EFE6DA; }
  .row:last-child { border-bottom: none; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 8px; margin-left: 6px; }
  .tag-on { background: #FFE0B2; color: #E65100; }
  .tag-off { background: #E8F5E9; color: #2E7D32; }
  .none { color: #9E9E9E; font-size: 13px; }
  button { border: none; border-radius: 10px; padding: 11px 18px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .btn-main { background: #FF8A65; color: #fff; width: 100%; }
  .btn-back { background: #EFE6DA; color: #5D4037; width: 100%; margin-top: 10px; }
  .warn { background: #FFF3E0; border-left: 4px solid #FF8A65; padding: 10px 12px; font-size: 13px; border-radius: 6px; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>阅读书目 · 诊断与清理</h1>
  <div class="sub">先看清楚数据，再决定要不要清。只动阅读相关，其它数据不动。</div>

  <div class="warn" id="verdict">正在读取…</div>

  <div class="card">
    <h2>📚 书库里标记为「在读」的书</h2>
    <div id="reading-list"></div>
  </div>

  <div class="card">
    <h2>📋 任务里残留的旧书目快照</h2>
    <div id="stale-list"></div>
  </div>

  <button class="btn-main" id="btn-clean">🧹 清除阅读选中状态（保留其它数据）</button>
  <button class="btn-back" id="btn-back">← 返回每日任务</button>
</div>

<script>
  const KEY = 'monster-pet-data';
  function load() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e) { return {}; } }
  function save(d) { localStorage.setItem(KEY, JSON.stringify(d)); }

  function render() {
    const d = load();
    const books = d.readingBooks || [];
    const reading = books.filter(b => b.reading && !b.finished);
    const rl = document.getElementById('reading-list');
    rl.innerHTML = reading.length
      ? reading.map(b => `<div class="row">${b.lang === 'en' ? '🇬🇧' : '🇨🇳'} ${escapeHtml(b.title)}<span class="tag tag-on">在读</span></div>`).join('')
      : '<div class="none">✅ 没有书被标记为在读（任务卡应该不显示任何书）</div>';

    const tasks = d.tasks || [];
    const stale = tasks.filter(t => t.category === 'reading' && t.books && t.books.length);
    const sl = document.getElementById('stale-list');
    sl.innerHTML = stale.length
      ? stale.map(t => `<div class="row">任务「${escapeHtml(t.title || t.templateId || '')}」存了 ${t.books.length} 本书的旧快照<span class="tag tag-on">残留</span></div>`).join('')
      : '<div class="none">✅ 没有旧书目快照残留</div>';

    const verdict = document.getElementById('verdict');
    if (reading.length || stale.length) {
      verdict.innerHTML = `⚠️ 找到 <b>${reading.length}</b> 本被标"在读"、<b>${stale.length}</b> 处旧快照 —— 这就是你在任务卡看到那两本书的原因。点下面的按钮清掉即可。`;
    } else {
      verdict.innerHTML = '✅ 数据干净：没有在读书、没有旧快照。如果你仍看到两本书，很可能是页面没刷新到最新版——返回后请强制刷新一次（Command+Shift+R）。';
    }
  }
  function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  document.getElementById('btn-clean').addEventListener('click', () => {
    const d = load();
    (d.readingBooks || []).forEach(b => { b.reading = false; });
    (d.tasks || []).forEach(t => {
      if (t.category === 'reading' || t.books) {
        delete t.books; delete t.bookAssignDate; delete t.readingMode;
      }
    });
    d.readingRotation = { en: null, cn: null };
    save(d);
    render();
    alert('已清除阅读选中状态。现在返回任务页，每日阅读下应该不显示任何书了。');
  });

  document.getElementById('btn-back').addEventListener('click', () => {
    location.href = './index.html#tasks';
  });

  render();
</script>
</body>
</html>
